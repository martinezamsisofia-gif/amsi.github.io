<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
}

.visor {
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    position: relative;
    background: #000;
    touch-action: none;
}

.contenedor {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    flex-direction: column;
    width: 100%;
    transition: transform 0.8s ease;
    will-change: transform;
}

.pagina {
    position: relative;
    flex: 0 0 auto;
    width: 100%;
    height: auto;
    display: block;
    line-height: 0;
}

.pagina img {
    width: 100%;
    height: auto;
    display: block;
    pointer-events: none;
}

/* BOTÓN DE MÚSICA */

.boton-musica {
    position: absolute;
    bottom: 27%;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 30px;
    border: 1px solid #d6b878;
    border-radius: 30px;
    background: rgba(0,0,0,0.8);
    color: #d6b878;
    font-size: 17px;
    cursor: pointer;
    z-index: 5;
    white-space: nowrap;
}

/* CONTADOR */

.contador-contenedor {
    position: absolute;
    bottom: 13%;
    left: 50%;
    transform: translateX(-50%);
    width: 94%;
    text-align: center;
    color: #d6b878;
    z-index: 5;
    pointer-events: none;
    padding: 0 5px;
    line-height: normal;
}

.contador-titulo {
    font-family: Georgia, serif;
    font-size: clamp(14px, 4vw, 17px);
    letter-spacing: 2px;
    margin-bottom: 14px;
    text-shadow: 0 0 10px rgba(214,184,120,0.5);
    white-space: nowrap;
}

.contador {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    align-items: center;
    justify-items: center;
    gap: 4px;
    width: 100%;
}

.unidad {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
    width: 100%;
}

.numero {
    font-family: Georgia, serif;
    font-size: clamp(23px, 7vw, 29px);
    font-weight: normal;
    line-height: 1.2;
    white-space: nowrap;
}

.etiqueta {
    font-family: Georgia, serif;
    font-size: clamp(8px, 2.5vw, 10px);
    letter-spacing: 1px;
    margin-top: 5px;
    white-space: nowrap;
}

/* INDICACIÓN */

.indicacion {
    position: absolute;
    bottom: 3%;
    width: 100%;
    text-align: center;
    color: #d6b878;
    font-size: 13px;
    z-index: 4;
    pointer-events: none;
    line-height: normal;
}

/* ESTILO DE BOTONES */

.boton-mapa,
.boton-regalos,
.boton-confirmar {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    padding: 13px 25px;
    border: 1px solid #d6b878;
    border-radius: 30px;
    background: rgba(0,0,0,0.85);
    color: #d6b878;
    font-family: Georgia, serif;
    font-size: 15px;
    letter-spacing: 1.5px;
    text-decoration: none;
    z-index: 6;
    white-space: nowrap;
    line-height: normal;
}

.boton-mapa {
    bottom: 18%;
}

.boton-regalos {
    bottom: 10%;
}

.boton-confirmar {
    bottom: 35%;
    left: 50%;
    transform: translateX(-50%);
}

/* MÚSICA OCULTA */

#musica {
    display: none;
}
</style>
</head>

<body>

<main class="visor" id="visor">

    <div class="contenedor" id="contenedor">

        <!-- PRIMERA PÁGINA -->

        <section class="pagina" id="pagina1">

            <img src="primera pagina.png" alt="Primera página">

            <button class="boton-musica" id="botonMusica">
                ♫ Reproducir
            </button>

            <div class="contador-contenedor">

                <h2 class="contador-titulo">
                    CADA VEZ FALTA MENOS
                </h2>

                <div class="contador">

                    <div class="unidad">
                        <span class="numero" id="dias">00</span>
                        <span class="etiqueta">DÍAS</span>
                    </div>

                    <div class="unidad">
                        <span class="numero" id="horas">00</span>
                        <span class="etiqueta">HORAS</span>
                    </div>

                    <div class="unidad">
                        <span class="numero" id="minutos">00</span>
                        <span class="etiqueta">MINUTOS</span>
                    </div>

                    <div class="unidad">
                        <span class="numero" id="segundos">00</span>
                        <span class="etiqueta">SEGUNDOS</span>
                    </div>

                </div>
            </div>

            <p class="indicacion">
                Desliza hacia arriba
            </p>

        </section>

        <!-- SEGUNDA PÁGINA -->

        <section class="pagina" id="pagina2">

            <img src="segunda pagina.png" alt="Segunda página">

            <a
                class="boton-mapa"
                href="https://www.google.com/maps/place/Salon+Jaguey/@20.9576554,-97.4168665,21z/data=!4m22!1m15!1m6!1m2!1s0x85d98b003ca9ce21:0xa8a715fbac1e12da!2sSalon+Jaguey,+Andrés+Quintana+Roo+29,+Federico+Garcia+Blanco,+92850+Túxpam+de+Rodríguez+Cano,+Ver.!2m2!1d-97.4166232!2d20.9576817?entry=ttu"
                target="_blank"
                rel="noopener noreferrer">
                VER MAPA
            </a>

        </section>

        <!-- TERCERA PÁGINA -->

        <section class="pagina" id="pagina3">

            <img src="tercera.png" alt="Tercera página">

            <a
                class="boton-regalos"
                href="https://www.amazon.com.mx/registries/gl/guest-view/3QYFMU39BH6MX?ref_=cm_sw_r_apann_ggr-subnav-share_HXD7BF052DQ8JD8J7VEZ_1&language=en-US"
                target="_blank"
                rel="noopener noreferrer">
                MESA DE REGALOS
            </a>

        </section>

        <!-- CUARTA PÁGINA -->

        <section class="pagina" id="pagina4">

            <img src="cuarta.png" alt="Cuarta página">

        </section>

        <!-- QUINTA PÁGINA -->

        <section class="pagina" id="pagina5">

            <img src="quinta.png" alt="Quinta página">

            <a
                class="boton-confirmar"
                href="https://wa.me/527831088842?text=%C2%A1Hola%21%20Con%20mucho%20gusto%20confirmo%20mi%20asistencia.%20Muchas%20gracias%20por%20la%20invitaci%C3%B3n%2C%20me%20dar%C3%A1%20mucho%20gusto%20acompa%C3%B1arlos%20y%20ser%20parte%20de%20esta%20celebraci%C3%B3n%20tan%20especial.%20%C2%A1Nos%20vemos%20pronto%21"
                target="_blank"
                rel="noopener noreferrer">
                CONFIRMAR ASISTENCIA
            </a>

        </section>

    </div>

    <!-- CANCIÓN MP3 -->

    <audio id="musica" preload="auto">
        <source src="Bruno Mars.mp3" type="audio/mpeg">
    </audio>

</main>

<script>

// ELEMENTOS

const contenedor = document.getElementById("contenedor");
const visor = document.getElementById("visor");
const musica = document.getElementById("musica");
const boton = document.getElementById("botonMusica");

let paginaActual = 0;
const totalPaginas = 5;

let inicioY = 0;
let inicioX = 0;
let desplazando = false;

// MÚSICA

boton.addEventListener("click", async (e) => {

    e.stopPropagation();

    if (musica.paused) {

        try {
            await musica.play();
            boton.textContent = "♫ Pausar";
        } catch (error) {
            boton.textContent = "No se pudo reproducir";
            console.error("Error al reproducir la música:", error);
        }

    } else {

        musica.pause();
        boton.textContent = "♫ Reproducir";

    }

});

musica.addEventListener("ended", () => {
    boton.textContent = "♫ Reproducir";
});

// CONTADOR REGRESIVO AL 2 DE ENERO DE 2027

const fechaObjetivo = new Date(2027, 0, 2, 0, 0, 0).getTime();

function actualizarContador() {

    const ahora = new Date().getTime();
    const diferencia = fechaObjetivo - ahora;

    if (diferencia <= 0) {

        document.getElementById("dias").textContent = "00";
        document.getElementById("horas").textContent = "00";
        document.getElementById("minutos").textContent = "00";
        document.getElementById("segundos").textContent = "00";

        document.querySelector(".contador-titulo").textContent =
            "¡HA LLEGADO EL DÍA!";

        return;
    }

    const dias = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const horas = Math.floor(
        (diferencia / (1000 * 60 * 60)) % 24
    );

    const minutos = Math.floor(
        (diferencia / (1000 * 60)) % 60
    );

    const segundos = Math.floor(
        (diferencia / 1000) % 60
    );

    document.getElementById("dias").textContent =
        String(dias).padStart(2, "0");

    document.getElementById("horas").textContent =
        String(horas).padStart(2, "0");

    document.getElementById("minutos").textContent =
        String(minutos).padStart(2, "0");

    document.getElementById("segundos").textContent =
        String(segundos).padStart(2, "0");

}

actualizarContador();
setInterval(actualizarContador, 1000);

// CAMBIAR ENTRE IMÁGENES

function cambiarPagina(numero) {

    if (numero < 0 || numero >= totalPaginas) return;

    paginaActual = numero;

    const paginas = document.querySelectorAll(".pagina");
    const posicion = paginas[numero].offsetTop;

    contenedor.style.transform =
        `translateY(-${posicion}px)`;

}

// RECALCULAR POSICIÓN AL CAMBIAR TAMAÑO

window.addEventListener("resize", () => {
    cambiarPagina(paginaActual);
});

// DESLIZAMIENTO

visor.addEventListener("pointerdown", (e) => {

    if (e.target.closest("button, a")) return;

    inicioY = e.clientY;
    inicioX = e.clientX;
    desplazando = true;

});

visor.addEventListener("pointerup", (e) => {

    if (!desplazando) return;

    desplazando = false;

    const diferenciaY = inicioY - e.clientY;
    const diferenciaX = inicioX - e.clientX;

    if (Math.abs(diferenciaY) < 50) return;

    if (Math.abs(diferenciaY) < Math.abs(diferenciaX)) return;

    if (diferenciaY > 0) {
        cambiarPagina(paginaActual + 1);
    } else {
        cambiarPagina(paginaActual - 1);
    }

});

visor.addEventListener("pointercancel", () => {
    desplazando = false;
});

// RUEDA DEL MOUSE

visor.addEventListener("wheel", (e) => {

    e.preventDefault();

    if (e.deltaY > 0) {
        cambiarPagina(paginaActual + 1);
    } else if (e.deltaY < 0) {
        cambiarPagina(paginaActual - 1);
    }

}, { passive: false });

// ESPERAR A QUE CARGUEN LAS IMÁGENES

window.addEventListener("load", () => {
    cambiarPagina(0);
});

</script>

</body>
